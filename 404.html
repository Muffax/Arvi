<!doctype html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sivua ei löytynyt</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon-32x32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon-16x16.png" sizes="16x16" type="image/png">
<link rel="shortcut icon" href="favicon.ico">
<style>
  :root{ --bg:#FAF9F6; --ink:#252D2C; --muted:#55635F; --accent:#14766B; color-scheme:light; }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--ink); font-family:"Segoe UI", sans-serif; text-align:center;
    padding:24px;
  }
  main{ max-width:480px; }
  h1{ font-family:Georgia, serif; font-size:2rem; margin:0 0 12px; }
  p{ color:var(--muted); line-height:1.6; margin:0 0 24px; }
  a{ color:var(--accent); font-weight:600; }
</style>
</head>
<body>
  <main>
    <h1>Sivua ei löytynyt</h1>
    <p>Etsimääsi sivua ei ole olemassa tai se on siirretty.</p>
    <a href="/">Palaa etusivulle</a>
  </main>
</body>
</html>
