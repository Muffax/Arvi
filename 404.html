<!doctype html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sivua ei löytynyt</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root{ --bg:#fbfdfc; --ink:#17302d; --muted:#55706f; --accent:#0e7a6c; color-scheme:light; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0e1716; --ink:#eaf2f0; --muted:#9bb0ac; --accent:#5fd7bf; color-scheme:dark; }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--ink); font-family:"Segoe UI", sans-serif; text-align:center;
    padding:24px;
  }
  main{ max-width:480px; }
  h1{ font-family:Georgia, serif; font-size:2rem; margin:0 0 12px; }
  p{ color:var(--muted); line-height:1.6; margin:0 0 24px; }
  a{ color:var(--accent); font-weight:600; }
</style>
</head>
<body>
  <main>
    <h1>Sivua ei löytynyt</h1>
    <p>Etsimääsi sivua ei ole olemassa tai se on siirretty.</p>
    <a href="/">Palaa etusivulle</a>
  </main>
</body>
</html>
